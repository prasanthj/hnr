[package]
name = "hnr"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html2text = "0.12"
open = "5"
anyhow = "1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
