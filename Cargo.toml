[package]
name = "hnr"
version = "0.4.1"
edition = "2021"
description = "h.n.r (HoNoR) — a fast terminal UI for Hacker News"
license = "MIT"
repository = "https://github.com/prasanthj/hnr"
homepage = "https://github.com/prasanthj/hnr"
keywords = ["hackernews", "tui", "terminal", "cli", "ratatui"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html2text = "0.12"
open = "5"
anyhow = "1"
futures = "0.3"
arboard = "3"
readability = "0.3.0"
url = "2.5.8"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
